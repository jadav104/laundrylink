services:
  # Spring Boot Backend API Service
  - type: web
    name: laundryhub-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000

  # React Vite Frontend Static Site
  - type: web
    name: laundryhub-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
