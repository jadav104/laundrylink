      --secondary-light: #d1fae5;

      --danger: #ef4444;

      --radius-md: 12px;
      --radius-lg: 20px;

      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);

    body { font-family: var(--font-body); background: var(--bg-main); color: var(--text-main); line-height: 1.5; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: 700; }

    .demo-btn-pill {
      background: #0f172a; color: white; padding: 4px 14px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px;
    }
    .demo-btn-pill:hover { background: #1e293b; }

    /* Role Switcher Banner */
    .role-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);

    .role-switcher { display: flex; gap: 6px; background: rgba(255, 255, 255, 0.12); padding: 4px; border-radius: var(--radius-full); }
    .role-btn {
      padding: 6px 18px; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600; color: #c7d2fe; background: transparent;
      display: flex; align-items: center; gap: 6px;
    }
    .role-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); }
    .role-btn.active { background: var(--primary); color: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 50; background: #ffffff; border-bottom: 1px solid var(--border-light);
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm);

    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; font-family: var(--font-heading); cursor: pointer; }
    .brand-icon {
      width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);

    .location-picker {

    .cart-btn {

    .hero-banner {

    .shops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; margin-bottom: 40px; }
    .shop-card { background: white; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; transition: 0.2s ease; }

    .shop-banner { height: 140px; background-size: cover; background-position: center; padding: 12px; display: flex; justify-content: space-between; }
    .shop-badge { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); color: white; padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; }
    .shop-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .shop-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .shop-address { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .view-btn { background: var(--primary); color: white; padding: 8px 18px; border-radius: var(--radius-md); font-weight: 600; }
    .view-btn:hover { background: var(--primary-hover); }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: white; border-radius: var(--radius-lg); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 10; }
    .close-btn { background: var(--bg-main); border-radius: var(--radius-full); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; }

    /* Stepper */
    .tracker-stepper { display: flex; justify-content: space-between; position: relative; margin: 24px 0; }
    .step-node { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2; background: white; padding: 0 4px; }
    .step-circle { width: 34px; height: 34px; border-radius: var(--radius-full); background: var(--bg-main); border: 2px solid var(--border-medium); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
    .step-node.completed .step-circle { background: var(--secondary); border-color: var(--secondary); color: white; }
    .step-node.active .step-circle { background: var(--primary); border-color: var(--primary); color: white; }

    /* Badges */
    .badge { display: inline-flex; padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-pending { background: var(--warning-light); color: #b45309; }
    .badge-processing { background: var(--accent-light); color: #0369a1; }

    .badge-rejected { background: var(--danger-light); color: var(--danger); }
    .badge-warning { background: var(--warning-light); color: #b45309; border: 1px solid #f59e0b; }

    .board-col { background: #f1f5f9; padding: 16px; border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 12px; }

      try {

                      <div style="padding: 16px; border: 2px solid ${qty > 0 ? 'var(--primary)' : 'var(--border-light)'}; background: ${qty > 0 ? 'var(--primary-light)' : 'var(--bg-main)'}; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: space-between; transition: all 0.15s ease;">
                        <div>
                          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
                            <span style="font-weight: 700; font-size: 0.95rem;">${item.name}</span>
                            <span style="font-size: 0.72rem; background: rgba(79, 70, 229, 0.12); color: var(--primary); padding: 2px 8px; border-radius: var(--radius-full); font-weight: 700;">
                              ${item.shopName}
                            </span>
                          </div>
                          <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">${item.desc}</p>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-light);">
                          <div style="font-weight: 800; color: var(--primary); font-size: 1.05rem;">
                            ₹${item.price.toFixed(2)} <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 400;">/${item.unit}</span>
                          </div>

                          ${qty === 0 ? `
                            <button class="view-btn" style="padding: 6px 14px; font-size: 0.8rem;" onclick="changeCartQty('${item.shopId}', '${item.id}', 1)">
                              + Add Service
                            </button>
                          ` : `
                            <div class="qty-controls">
                              <button class="qty-btn" onclick="changeCartQty('${item.shopId}', '${item.id}', -1)">-</button>
                              <span style="font-weight: 700; min-width: 18px; text-align: center;">${qty}</span>
                              <button class="qty-btn" onclick="changeCartQty('${item.shopId}', '${item.id}', 1)">+</button>
                            </div>
                          `}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Nearby Shops Fulfilling Order Section -->
              <div style="background: white; border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                  <div>
                    <h2 style="font-size: 1.3rem; font-weight: 800;">🏪 Nearby Laundry Shops for Your Order</h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Compare verified local shops near Alkapuri, Vadodara and choose your preferred provider</p>
                  </div>
                  <span class="badge badge-approved" style="background: var(--secondary-light); color: var(--secondary); font-size: 0.8rem;">
                    ${activeShops.length} Partners Available
                  </span>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
                  ${activeShops.map(shop => {
                    const isAssigned = state.cart.shopId === shop.id;
                    return `
                      <div style="border: ${isAssigned ? '2px solid var(--primary)' : '1px solid var(--border-light)'}; background: ${isAssigned ? 'var(--primary-light)' : 'white'}; border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="height: 110px; background-image: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7)), url(${shop.image}); background-size: cover; background-position: center; padding: 10px 14px; display: flex; justify-content: space-between; align-items: flex-start;">
                          <span class="shop-badge" style="background: rgba(15,23,42,0.85); color: white;">📍 ${shop.distance}</span>
                          ${shop.emergencyAvailable ? `
                            <span class="shop-badge" style="background: #b45309; color: white;">⚡ 3h Emergency Ready</span>
                          ` : `
                            <span class="shop-badge" style="background: var(--secondary); color: white;">⭐ ${shop.rating}</span>
                          `}
                        </div>

                        <div style="padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                          <div>
                            <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 4px;">${shop.name}</h3>
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">📍 ${shop.address}</p>
                            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px;">
                              ${shop.tags.map(t => `<span class="tag" style="font-size: 0.7rem;">${t}</span>`).join('')}
                            </div>
                          </div>

                          <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-light);">
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Turnaround: <strong>${shop.turnaround}</strong></span>
                            ${isAssigned ? `
                              <button class="view-btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="openCheckout()">✓ Assigned Shop</button>
                            ` : `
                              <button class="filter-chip" style="padding: 6px 12px; font-size: 0.8rem;" onclick="assignShopToCart('${shop.id}', '${shop.name}')">Select Shop</button>
                            `}
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

            </div>

            <!-- Right Sticky Column: Live Bill & Subtotal Calculation Panel -->
            <div style="position: sticky; top: 90px; background: white; border-radius: var(--radius-lg); border: 2px solid var(--primary); box-shadow: var(--shadow-md); padding: 20px;">
              <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 16px;">
                <div>
                  <h3 style="font-size: 1.15rem; font-weight: 800;">🧾 Live Bill Calculator</h3>
                  ${activeAssignedShop ? `
                    <div style="font-size: 0.8rem; color: var(--primary); font-weight: 700;">🏪 Assigned: ${activeAssignedShop.name}</div>
                  ` : `
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Auto-assigned to nearby shop</div>
                  `}
                </div>
                <span class="cart-count" style="width: 26px; height: 26px; font-size: 0.85rem;">${cartCount}</span>
              </div>

              ${cartItems.length === 0 ? `
                <div style="text-align: center; padding: 40px 10px; color: var(--text-muted);">
                  <div style="font-size: 2.8rem; margin-bottom: 8px;">🧺</div>
                  <h4 style="font-size: 1rem; font-weight: 700; color: var(--text-main);">Your Laundry Bag is Empty</h4>
                  <p style="font-size: 0.85rem; margin-top: 6px; line-height: 1.4;">
                    Click <strong>"+ Add Service"</strong> on any service item above to calculate your subtotal & fees live!
                  </p>
                </div>
              ` : `
                <!-- Selected Items List -->
                <div style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; padding-right: 4px;">
                  ${cartItems.map(item => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--bg-main); border-radius: var(--radius-md); border: 1px solid var(--border-light); font-size: 0.85rem;">
                      <div>
                        <div style="font-weight: 600;">${item.name}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">₹${item.price.toFixed(2)} / ${item.unit}</div>
                      </div>
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="qty-controls" style="scale: 0.85;">
                          <button class="qty-btn" onclick="changeCartQty('${state.cart.shopId}', '${item.id}', -1)">-</button>
                          <span style="font-weight: 700; min-width: 14px; text-align: center;">${item.qty}</span>
                          <button class="qty-btn" onclick="changeCartQty('${state.cart.shopId}', '${item.id}', 1)">+</button>
                        </div>
                        <span style="font-weight: 800; min-width: 50px; text-align: right;">₹${(item.price * item.qty).toFixed(2)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>

                <!-- Delivery Speed / Emergency Mode Selection -->
                <div style="margin-bottom: 16px;">
                  <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">⚡ Delivery Speed & Surge Option:</div>
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    ${[
                      { id: 'standard', label: 'Standard Delivery (24-48h)', extra: 0 },
                      { id: 'express', label: '⚡ Express Delivery (12-24h)', extra: 49.00 },
                      { id: 'emergency', label: '🚨 Emergency Super Express (3h Rush)', extra: 99.00 }
                    ].map(mode => {
                      const isSel = currentMode === mode.id;
                      return `
                        <button onclick="setDeliveryMode('${mode.id}')" style="padding: 8px 12px; border-radius: var(--radius-md); font-size: 0.78rem; font-weight: ${isSel ? '700' : '500'}; border: ${isSel ? '2px solid var(--primary)' : '1px solid var(--border-medium)'}; background: ${isSel ? 'var(--primary-light)' : 'white'}; color: ${isSel ? 'var(--primary)' : 'var(--text-main)'}; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                          <span>${mode.label}</span>
                          <span style="font-weight: 800; color: ${mode.extra > 0 ? '#b45309' : 'var(--secondary)'};">
                            ${mode.extra > 0 ? `+₹${mode.extra.toFixed(2)}` : 'FREE'}
                          </span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- Special Care Preferences Selector -->
                <div style="margin-bottom: 16px;">
                  <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">✨ Care Preferences:</div>
                  <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                    ${["Standard Detergent", "Hypoallergenic", "Organic Detergent", "Extra Softener", "Extra Starch"].map(pref => {
                      const isSel = (state.cart.carePreferences || []).includes(pref);
                      return `
                        <button onclick="toggleCarePref('${pref}')" style="padding: 4px 8px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 600; border: 1px solid ${isSel ? 'var(--primary)' : 'var(--border-medium)'}; background: ${isSel ? 'var(--primary-light)' : 'white'}; color: ${isSel ? 'var(--primary)' : 'var(--text-muted)'}; cursor: pointer;">
                          ${isSel ? '✓ ' : ''}${pref}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- Live Bill Summary Box -->
                <div style="background: var(--bg-main); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-medium); margin-bottom: 16px;">
                  <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px;">
                    <span>Items Subtotal</span>
                    <span style="font-weight: 700;">₹${subtotal.toFixed(2)}</span>
                  </div>
                  ${surgeFee > 0 ? `
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: #b45309; font-weight: 600;">
                      <span>Speed Surge (${currentMode.toUpperCase()})</span>
                      <span>+₹${surgeFee.toFixed(2)}</span>
                    </div>
                  ` : ''}
                  <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted);">
                    <span>Doorstep Pickup & Delivery</span>
                    <span>₹${deliveryFee.toFixed(2)}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 10px; color: var(--text-muted);">
                    <span>Service & Platform Fee</span>
                    <span>₹${serviceFee.toFixed(2)}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 2px dashed var(--border-medium); font-weight: 800; font-size: 1.15rem; color: var(--primary);">
                    <span>Total Bill</span>
                    <span>₹${grandTotal.toFixed(2)}</span>
                  </div>
                </div>

                <button class="view-btn" style="width: 100%; padding: 14px; font-size: 1rem; text-align: center; border-radius: var(--radius-full);" onclick="openCheckout()">
                  💳 Schedule Pickup (₹${grandTotal.toFixed(2)})
                </button>
              `}
            </div>

          </div>
        </div>
      `;
    }

    function switchVendorShop(shopId) {
      state.activeVendorId = shopId;
      if (state.user) state.user.shopId = shopId;
      render();
    }

    function renderVendorView() {
      if (!state.shops || state.shops.length === 0) {
        return `<div style="padding: 40px; text-align: center; color: var(--text-muted);"><h3>No Laundry Shops Available</h3></div>`;
      }
      const activeShopId = (state.user && state.user.shopId) || state.activeVendorId || (state.shops[0] ? state.shops[0].id : 'shop-1');
      const activeShop = (state.shops || []).find(s => s.id === activeShopId) || state.shops[0];
      if (!activeShop) {
        return `<div style="padding: 40px; text-align: center; color: var(--text-muted);"><h3>No Shop Selected</h3></div>`;
      }

      const warnings = activeShop.warnings || [];
      const hasWarning = warnings.length > 0;
      const isVendorUser = state.user && state.role === 'vendor';
      const isDemoSession = !state.user || state.user.isDemo || state.user.id === 'usr-jadav';

      // Real Provider Mode: show ONLY real customer orders. Demo Mode: show presentation sample orders.
      const shopOrders = (state.orders || []).filter(o => {
        if (!o || o.shopId !== activeShop.id) return false;
        if (!isDemoSession && o.isDemo) return false;
        return true;
      });

      const pendingOrders = shopOrders.filter(o => o.status === 'Order Placed');
      const washingOrders = shopOrders.filter(o => o.status === 'In Washing' || o.status === 'Picked Up');
      const readyOrders = shopOrders.filter(o => o.status === 'Ready' || o.status === 'Out for Delivery');
      const completedOrders = shopOrders.filter(o => o.status === 'Completed');
      const rejectedOrders = shopOrders.filter(o => o.status === 'Rejected');

      const totalRev = completedOrders.concat(washingOrders, readyOrders).reduce((s, o) => s + (o.totalAmount || 0), 0);
      const totalDecided = shopOrders.length - pendingOrders.length;
      const acceptanceRate = totalDecided > 0 ? Math.round(((totalDecided - rejectedOrders.length) / totalDecided) * 100) : 100;

      return `
        <div>
          ${hasWarning ? `
            <div style="background: var(--warning-light); border: 2px solid var(--warning); color: #92400e; padding: 16px 20px; border-radius: var(--radius-lg); margin-bottom: 24px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-weight: 800; font-size: 1.1rem;">⚠️ OFFICIAL ADMIN WARNING ISSUED (${warnings.length})</div>
                <span class="badge badge-warning">Action Required</span>
              </div>
              <p style="font-size: 0.9rem; margin-top: 6px;">
                Latest Note from Platform Admin: <strong>"${warnings[warnings.length - 1]?.reason || 'Warning issued'}"</strong>
              </p>
              <div style="font-size: 0.75rem; color: #b45309; margin-top: 4px;">
                Date Issued: ${warnings[warnings.length - 1]?.date || 'Today'}.
              </div>
            </div>
          ` : ''}

          ${!isDemoSession ? `
            <div style="background: #f0fdf4; border: 1px solid #86efac; color: #166534; padding: 12px 18px; border-radius: var(--radius-md); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600;">
              <div>
                🟢 <strong>Live Real Provider Account:</strong> Showing only real customer orders placed for <strong>${activeShop.name}</strong>. Dummy demo orders are hidden.
              </div>
              <span class="badge badge-approved" style="background: #22c55e; color: white;">REAL DATA ONLY</span>
            </div>
          ` : `
            <div style="background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;">
              <div>
                🎬 <strong>Presentation Demo Mode:</strong> Showing sample mock orders for feature testing. Log in as a registered provider to view real store data.
              </div>
              <span class="badge" style="background: #3b82f6; color: white;">DEMO SAMPLE MODE</span>
            </div>
          `}

          <!-- Header -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
              <h2 style="font-size: 1.6rem; font-weight: 800;">🏪 ${activeShop.name} Portal</h2>
              <p style="font-size: 0.85rem; color: var(--text-muted);">Owner: ${activeShop.ownerName} | Address: ${activeShop.address}</p>
            </div>
            ${isVendorUser ? `
              <div style="background: var(--primary-light); color: var(--primary); font-weight: 700; padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.85rem; border: 1px solid var(--primary); display: flex; align-items: center; gap: 6px;">
                🔒 Logged in Store: <strong>${activeShop.name}</strong>
              </div>
            ` : `
              <select onchange="switchVendorShop(this.value)" style="padding: 10px 16px; border-radius: var(--radius-full); font-weight: 700; border: 1px solid var(--primary); color: var(--primary);">
                ${state.shops.map(s => `<option value="${s.id}" ${s.id === activeShop.id ? 'selected' : ''}>${s.name}</option>`).join('')}
              </select>
            `}
          </div>

          <!-- INCOMING REQUEST ALERT BANNER -->
          ${pendingOrders.length > 0 ? `
            <div style="background: linear-gradient(135deg, #fffbe6 0%, #fef3c7 100%); border: 2px solid #f59e0b; padding: 20px 24px; border-radius: var(--radius-lg); margin-bottom: 28px; box-shadow: 0 4px 16px rgba(245,158,11,0.25);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 14px;">
                  <div style="width: 44px; height: 44px; border-radius: 50%; background: #f59e0b; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;">
                    🔔
                  </div>
                  <div>
                    <h3 style="font-size: 1.25rem; color: #92400e; margin: 0; display: flex; align-items: center; gap: 8px;">
                      🚨 ${pendingOrders.length} New Incoming Service Request${pendingOrders.length > 1 ? 's' : ''} Waiting!
                      <span class="badge badge-warning" style="background: #d97706; color: white;">PULSE ALERT</span>
                    </h3>
                    <p style="font-size: 0.85rem; color: #b45309; margin-top: 2px;">
                      New customer requests are waiting for your approval. Click Accept or Reject below to confirm slot.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Metrics Row -->
          <div class="stats-grid" style="margin-bottom: 28px;">
            <div class="stat-card">
              <div>
                <div class="stat-val" style="color: #b45309;">${pendingOrders.length}</div>
                <div class="stat-lbl">📥 Incoming Requests</div>
              </div>
            </div>
            <div class="stat-card">
              <div>
                <div class="stat-val">₹${totalRev.toFixed(2)}</div>
                <div class="stat-lbl">Today's Revenue</div>
              </div>
            </div>
            <div class="stat-card">
              <div>
                <div class="stat-val">${washingOrders.length + readyOrders.length}</div>
                <div class="stat-lbl">Active In-Wash Jobs</div>
              </div>
            </div>
            <div class="stat-card">
              <div>
                <div class="stat-val">${acceptanceRate}%</div>
                <div class="stat-lbl">Acceptance Rate</div>
              </div>
            </div>
          </div>

          <h3 style="margin-bottom: 16px; font-size: 1.25rem;">Live Order Operations Pipeline</h3>
          <div class="orders-board">
            <!-- 1. INCOMING REQUESTS -->
            <div class="board-col">
              <h4 style="font-size: 0.95rem; color: #b45309; display: flex; justify-content: space-between; align-items: center;">
                <span>📥 Incoming Requests (${pendingOrders.length})</span>
                ${pendingOrders.length > 0 ? '<span style="font-size: 0.65rem; background: #f59e0b; color: white; padding: 2px 6px; border-radius: 999px;">PULSE</span>' : ''}
              </h4>
              ${pendingOrders.length === 0 ? `
                <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 24px; background: white; border-radius: var(--radius-md);">
                  No new pending requests
                </div>
              ` : pendingOrders.map(ord => `
                <div class="order-card" style="border-left: 4px solid #f59e0b; background: #fffbeb; padding: 14px; border-radius: var(--radius-md); margin-bottom: 12px; box-shadow: var(--shadow-sm);">
                  <div style="display: flex; justify-content: space-between; font-weight: 800; color: var(--primary);">
                    <span>#${ord.id}</span>
                    <span class="badge badge-warning">NEW REQUEST</span>
                  </div>
                  <div style="font-weight: 700; margin-top: 4px; font-size: 0.95rem;">${ord.customerName}</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">📞 ${ord.customerPhone}</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">📍 ${ord.pickupAddress}</div>
                  
                  ${ord.deliveryMode === 'emergency' ? `
                    <div style="margin-top: 6px; font-size: 0.72rem; background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: var(--radius-full); font-weight: 800; display: inline-block;">
                      🚨 Emergency 3h Rush
                    </div>
                  ` : ''}

                  <div style="margin-top: 8px; font-size: 0.8rem; background: white; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid #fde68a;">
                    ${(ord.items || []).map(i => `<div>• ${i.name} (x${i.qty} ${i.unit})</div>`).join('')}
                  </div>

                  <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 800; color: var(--primary);">₹${(ord.totalAmount || 0).toFixed(2)}</span>
                    <button class="filter-chip" style="padding: 3px 8px; font-size: 0.72rem;" onclick="openVendorSummaryModal('${ord.id}')">
                      📋 Summary
                    </button>
                  </div>

                  <!-- ACCEPT & REJECT BUTTONS -->
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                    <button class="filter-chip" style="color: var(--danger); border-color: var(--danger-light); background: var(--danger-light); font-weight: 700; padding: 6px; font-size: 0.78rem;" onclick="openVendorRejectModal('${ord.id}')">
                      ❌ Reject
                    </button>
                    <button class="view-btn" style="background: var(--secondary); color: white; font-weight: 700; padding: 6px; font-size: 0.78rem;" onclick="acceptVendorOrder('${ord.id}')">
                      ✅ Accept
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- 2. IN WASHING -->
            <div class="board-col">
              <h4 style="font-size: 0.95rem; color: var(--primary);">🫧 In Wash & Care (${washingOrders.length})</h4>
              ${washingOrders.length === 0 ? `
                <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 24px; background: white; border-radius: var(--radius-md);">
                  No active washing jobs
                </div>
              ` : washingOrders.map(ord => `

    function updateCheckoutProviders(val) {
      if (val) {
        state.userLocation = val;
        saveDB('userLocation', val);
      }
      const userAddr = (val || '').toLowerCase();
      const shopContainer = document.getElementById('checkout-providers-list');
      if (!shopContainer) return;

      const activeShops = state.shops.filter(s => s.status !== 'Delisted');

      const getDynamicDistance = (shopAddress) => {
        const shopAddr = (shopAddress || '').toLowerCase();
        if (userAddr.includes('bhayli')) {
          if (shopAddr.includes('bhayli') || shopAddr.includes('vasna')) return '0.3 km away (Nearest)';
          if (shopAddr.includes('gotri')) return '0.9 km away';
          if (shopAddr.includes('akota')) return '1.4 km away';
          if (shopAddr.includes('op road')) return '1.8 km away';
          return '2.4 km away';
        }
        if (userAddr.includes('akota') && shopAddr.includes('akota')) return '0.3 km away (Nearest)';
        if (userAddr.includes('alkapuri') && shopAddr.includes('alkapuri')) return '0.4 km away (Nearest)';
        if (userAddr.includes('fatehgunj') && shopAddr.includes('fatehgunj')) return '0.4 km away (Nearest)';
        if (userAddr.includes('manjalpur') && shopAddr.includes('manjalpur')) return '0.4 km away (Nearest)';
        if (userAddr.includes('karelibaug') && shopAddr.includes('karelibaug')) return '0.5 km away (Nearest)';
        if (userAddr.includes('gotri') && shopAddr.includes('gotri')) return '0.4 km away (Nearest)';
        if (userAddr.includes('sayajigunj') && shopAddr.includes('sayajigunj')) return '0.3 km away (Nearest)';
        if ((userAddr.includes('op road') || userAddr.includes('old padra')) && (shopAddr.includes('op road') || shopAddr.includes('old padra'))) return '0.4 km away (Nearest)';
        if (userAddr.includes('waghodia') && shopAddr.includes('waghodia')) return '0.5 km away (Nearest)';
        if ((userAddr.includes('subhanpura') || userAddr.includes('ellora')) && (shopAddr.includes('subhanpura') || shopAddr.includes('ellora'))) return '0.3 km away (Nearest)';
        if (userAddr.includes('vasna') && shopAddr.includes('vasna')) return '0.4 km away (Nearest)';
        if (userAddr.includes('gorwa') && shopAddr.includes('gorwa')) return '0.5 km away (Nearest)';
        if (userAddr.includes('makarpura') && shopAddr.includes('makarpura')) return '0.6 km away (Nearest)';
        if (userAddr.includes('tarsali') && shopAddr.includes('tarsali')) return '0.5 km away (Nearest)';
        if (userAddr.includes('chhani') && shopAddr.includes('chhani')) return '0.4 km away (Nearest)';
        if (userAddr.includes('sama') && shopAddr.includes('sama')) return '0.3 km away (Nearest)';
        if (userAddr.includes('nizampura') && shopAddr.includes('nizampura')) return '0.4 km away (Nearest)';
        return '1.1 km away';
      };

      const sorted = [...activeShops].sort((a, b) => {
        const distA = getDynamicDistance(a.address);
        const distB = getDynamicDistance(b.address);
        return distA.includes('(Nearest)') ? -1 : distB.includes('(Nearest)') ? 1 : 0;
      });

      shopContainer.innerHTML = sorted.map((shop, idx) => {
        const dynamicDist = getDynamicDistance(shop.address);
        const isClosest = dynamicDist.includes('(Nearest)');
        return `
          <label style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: var(--radius-md); border: ${idx === 0 ? '2px solid var(--primary)' : '1px solid var(--border-medium)'}; background: ${idx === 0 ? 'var(--primary-light)' : 'white'}; cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <input type="radio" name="selectedProvider" value="${shop.id}" ${idx === 0 ? 'checked' : ''} />
              <div>
                <div style="font-weight: 700; font-size: 0.9rem;">
                  ${shop.name} ${isClosest ? '<span style="font-size: 0.68rem; background: var(--secondary-light); color: var(--secondary); padding: 1px 6px; border-radius: var(--radius-full); margin-left: 6px;">Closest Match</span>' : ''}
                </div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">📍 ${shop.address} • ⚡ ${dynamicDist}</div>
              </div>
            </div>
            <div style="text-align: right; font-size: 0.78rem; font-weight: 700; color: var(--secondary);">
              ⭐ ${shop.rating}
            </div>
          </label>
        `;
      }).join('');
    }

    function submitIssueWarning(e, shopId) {
      e.preventDefault();
      const shop = state.shops.find(s => s.id === shopId);
      if (!shop) return;

      const reasonSelect = document.getElementById('warningReasonSelect')?.value;
      const detailInput = document.getElementById('warningDetailInput')?.value;
      const reason = detailInput ? `${reasonSelect}: ${detailInput}` : reasonSelect;

      if (!shop.warnings) shop.warnings = [];
      shop.warnings.push({
        id: 'warn-' + Date.now(),
        reason: reason,
        date: new Date().toLocaleDateString()
      });
      shop.status = 'Warning Issued';

      saveDB('shops', state.shops);
      state.warningModalShopId = null;
      render();
    }

      const emailInput = document.getElementById('authEmailInput')?.value;
      const passInput = document.getElementById('authPassInput')?.value;
      const nameInput = document.getElementById('authNameInput')?.value;
      const ownerInput = document.getElementById('authOwnerInput')?.value;

      state.authErrorMsg = '';

      if (authAction === 'login') {
        const found = state.userDB.find(u =>
          (u.email.toLowerCase() === emailInput.toLowerCase() || u.phone === emailInput) &&
          u.password === passInput
        );

        if (found) {
          state.user = found;
          state.role = found.role;
          state.authTab = 'none';
          state.view = 'app';
          saveSession();
          render();
        } else {
          state.authErrorMsg = 'Invalid email/phone or password!';
          render();
        }
      } else {
        const exists = state.userDB.find(u => u.email.toLowerCase() === emailInput.toLowerCase());
        if (exists) {
          state.authErrorMsg = 'An account with this email already exists in the database!';
          render();
          return;
        }

        const newUser = {
          id: 'usr-' + Date.now(),
          role: targetRole,
          name: nameInput || (targetRole === 'customer' ? 'Customer' : ownerInput || 'Shop Owner'),
          email: emailInput,
          phone: '+1 (555) 999-8888',
          address: 'Main Street 101',
          password: passInput
        };

        if (targetRole === 'vendor') {
          const newShopId = 'shop-' + Date.now();
          const newShopName = nameInput || 'New Express Laundry';
          const newShop = {
            id: newShopId,
            name: newShopName,
            ownerName: ownerInput || 'Shop Owner',
            rating: 5.0,
            reviewsCount: 1,
            distance: '0.4 km away (Newly Partnered)',
            turnaround: '24 Hours',
            expressAvailable: true,
            emergencyAvailable: true,
            address: 'Alkapuri, Vadodara',
            phone: '+91 98765 43210',
            image: 'https://images.unsplash.com/photo-1545173168-9f1947eebb7f?auto=format&fit=crop&w=800&q=80',
            tags: ['Verified Partner', 'New Shop', 'Express 24h', 'Dry Cleaning'],
            status: 'Approved',
            minOrder: '₹120.00',
            commissionRate: '15%',
            warnings: [],
            services: [
              { id: 's1', name: 'Wash & Fold (per kg)', price: 60.00, unit: 'kg', desc: 'Clean daily wear' },
              { id: 's2', name: 'Steam Press Ironing', price: 25.00, unit: 'piece', desc: 'Crisp press finish' },
              { id: 's3', name: 'Heavy Saree & Suit Dry Clean', price: 250.00, unit: 'set', desc: 'Eco solvent dry clean' },
              { id: 's4', name: 'Sneaker & Shoe Cleansing', price: 249.00, unit: 'pair', desc: 'Shoe scrubbing & deodorizing' }
            ]
          };

          newUser.shopId = newShopId;
          state.shops.unshift(newShop);
          saveDB('shops', state.shops);
        }

        state.userDB.push(newUser);
        saveDB('userDB', state.userDB);

        state.user = newUser;
        state.role = targetRole;
        state.authTab = 'none';
        state.view = 'app';
        saveSession();
        render();
      }
    }

    function openShopModal(id) { state.activeShopModal = id; render(); }
    function closeShopModal() { state.activeShopModal = null; render(); }

    function getCartItemQty(shopId, svcId) {
      if (state.cart.shopId !== shopId) return 0;
      const item = (state.cart.items || []).find(i => i.id === svcId);
      return item ? item.qty : 0;
    }

    function changeCartQty(shopId, svcId, delta) {
      const shop = state.shops.find(s => s.id === shopId);
      if (!shop) return;
      const svc = shop.services.find(s => s.id === svcId);
      if (!svc) return;

      if (state.cart.shopId && state.cart.shopId !== shopId) {
        if (delta > 0) {
          if (confirm(`Your cart contains items from "${state.cart.shopName}". Clear cart and start new order with "${shop.name}"?`)) {
            state.cart = { shopId: shop.id, shopName: shop.name, items: [{ ...svc, qty: delta }], carePreferences: ["Standard Detergent"] };
          } else {
            return;
          }
        }
      } else {
        if (!state.cart.items) state.cart.items = [];
        const idx = state.cart.items.findIndex(i => i.id === svcId);
        if (idx > -1) {
          const newQty = state.cart.items[idx].qty + delta;
          if (newQty > 0) {
            state.cart.items[idx].qty = newQty;
          } else {
            state.cart.items.splice(idx, 1);
            if (state.cart.items.length === 0) {
              state.cart.shopId = null;
              state.cart.shopName = '';
            }
          }
        } else if (delta > 0) {
          state.cart.shopId = shop.id;
          state.cart.shopName = shop.name;
          state.cart.items.push({ ...svc, qty: delta });
        }
      }
      render();
    }

    function setDeliveryMode(m) {
      state.cart.deliveryMode = m;
      render();
    }

    function assignShopToCart(shopId, shopName) {
      state.cart.shopId = shopId;
      state.cart.shopName = shopName;
      render();
    }

    function toggleCarePref(pref) {
      if (!state.cart.carePreferences) state.cart.carePreferences = ["Standard Detergent"];
      const idx = state.cart.carePreferences.indexOf(pref);
      if (idx > -1) {
        state.cart.carePreferences.splice(idx, 1);
      } else {
        state.cart.carePreferences.push(pref);
      }
      render();
    }

    function addToCart(shopId, svcId) {
      changeCartQty(shopId, svcId, 1);
    }

    function openCart() { state.isCartOpen = true; render(); }
    function closeCart() { state.isCartOpen = false; render(); }
    function openCheckout() { state.isCheckoutOpen = true; render(); }
    function closeCheckout() { state.isCheckoutOpen = false; render(); }

    function placeOrder(e) {
      e.preventDefault();
      const selectedRadio = document.querySelector('input[name="selectedProvider"]:checked');
      const selectedId = selectedRadio ? selectedRadio.value : state.cart.shopId;
      const targetShop = state.shops.find(s => s.id === selectedId);

      const subtotal = (state.cart.items || []).reduce((s, i) => s + i.price * i.qty, 0);
      const mode = state.cart.deliveryMode || 'standard';
      const surgeFee = mode === 'emergency' ? 99.00 : mode === 'express' ? 49.00 : 0;
      const total = subtotal > 0 ? subtotal + 45.00 + surgeFee : 0;

      const newOrd = {
        id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
        customerName: state.user?.name || "Priya Patel",
        customerPhone: state.user?.phone || "+91 98765 43210",
        shopId: selectedId || "shop-1",
        shopName: targetShop?.name || state.cart.shopName || "Sparkle & Spin Laundry Hub",
        status: "Order Placed",
        items: state.cart.items || [],
        deliveryMode: mode,
        totalAmount: total,
        pickupAddress: document.getElementById('checkout-address')?.value || state.user?.address || "Flat 302, Royal Residency, Alkapuri, Vadodara",
        deliverySlot: mode === 'emergency' ? 'Today (In 3 Hours Rush)' : 'Tomorrow, 5:00 PM'
      };
      state.orders.unshift(newOrd);
      saveDB('orders', state.orders);

      fetch(`${API_BASE}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newOrd)
      }).catch(() => {});

      state.activeTrackerId = newOrd.id;
      state.cart = { shopId: null, shopName: '', items: [], deliveryMode: 'standard' };
      state.isCheckoutOpen = false;
      render();
    }

    function openTracker(id) { state.activeTrackerId = id; render(); }
    function closeTracker() { state.activeTrackerId = null; render(); }

    function advanceOrder(ordId, currentKey) {
      const ord = state.orders.find(o => o.id === ordId);
      if (ord) {
        if (currentKey === 'Order Placed') ord.status = 'In Washing';
        else if (currentKey === 'In Washing') ord.status = 'Ready';
        else if (currentKey === 'Ready') ord.status = 'Completed';
        saveDB('orders', state.orders);

        fetch(`${API_BASE}/orders/${ordId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: ord.status })
        }).catch(() => {});
      }
      render();
    }

    function acceptVendorOrder(ordId) {
      const ord = state.orders.find(o => o.id === ordId);
      if (ord) {
        ord.status = 'In Washing';
        saveDB('orders', state.orders);

        fetch(`${API_BASE}/orders/${ordId}/accept`, {
          method: 'PUT'
        }).catch(() => {});
        render();
      }
    }

    function openVendorRejectModal(ordId) {
      state.vendorRejectModalId = ordId;
      render();
    }

    function closeVendorRejectModal() {
      state.vendorRejectModalId = null;
      render();
    }

    function submitVendorRejectOrder(e, ordId) {
      e.preventDefault();
      const ord = state.orders.find(o => o.id === ordId);
      if (ord) {
        const reasonSelect = document.getElementById('vendorRejectReasonSelect')?.value;
        const customNote = document.getElementById('vendorRejectNoteInput')?.value;
        const finalReason = customNote ? `${reasonSelect} - ${customNote}` : reasonSelect;
        ord.status = 'Rejected';
        ord.rejectionReason = finalReason || 'Declined by provider';
        saveDB('orders', state.orders);
      }
      state.vendorRejectModalId = null;
      render();
    }

    function openVendorSummaryModal(ordId) {
      state.vendorSummaryModalId = ordId;
      render();
    }

    function closeVendorSummaryModal() {
      state.vendorSummaryModalId = null;
      render();
    }

    function renderVendorRejectModal() {
      if (!state.vendorRejectModalId) return '';
      const ord = state.orders.find(o => o.id === state.vendorRejectModalId);
      if (!ord) return '';

      return `
        <div class="modal-overlay" onclick="closeVendorRejectModal()">
          <div class="modal-content" style="max-width: 480px;" onclick="event.stopPropagation()">
            <div class="modal-header" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: white;">
              <div>
                <h3 style="color: white;">❌ Decline Order #${ord.id}</h3>
                <p style="font-size: 0.8rem; color: #fee2e2;">Customer: ${ord.customerName}</p>
              </div>
              <button class="close-btn" style="color: white; background: rgba(255,255,255,0.2);" onclick="closeVendorRejectModal()">✕</button>
            </div>
            <form onsubmit="submitVendorRejectOrder(event, '${ord.id}')" style="padding: 24px;">
              <div style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 16px;">
                <strong>⚠️ Order Rejection Warning:</strong> Declining will release customer funds and notify them immediately.
              </div>
              <div style="margin-bottom: 16px;">
                <label style="font-size: 0.85rem; font-weight: 600;">Reason for Rejection</label>
                <select id="vendorRejectReasonSelect" style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-medium); margin-top: 4px;">
                  <option>Shop Capacity Full for Selected Slot</option>
                  <option>Out of Pickup/Delivery Coverage Radius</option>
                  <option>Equipment Maintenance / Washer Down</option>
                  <option>Requested Emergency 3h Rush Unavailable</option>
                  <option>Special Garment Fabric Not Supported</option>
                  <option>Custom Reason</option>
                </select>
              </div>
              <div style="margin-bottom: 20px;">
                <label style="font-size: 0.85rem; font-weight: 600;">Additional Customer Note (Optional)</label>
                <textarea id="vendorRejectNoteInput" rows="3" style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-medium); margin-top: 4px;" placeholder="Next available slot is tomorrow..."></textarea>
              </div>
              <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="filter-chip" onclick="closeVendorRejectModal()">Cancel</button>
                <button type="submit" class="view-btn" style="background: var(--danger); color: white;">Confirm Decline & Reject</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderVendorSummaryModal() {
      if (!state.vendorSummaryModalId) return '';
      const ord = state.orders.find(o => o.id === state.vendorSummaryModalId);
      if (!ord) return '';

      const isPending = ord.status === 'Order Placed';
      const isRejected = ord.status === 'Rejected';

      const subtotal = (ord.items || []).reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);
      const surgeFee = ord.deliveryMode === 'emergency' ? 99.00 : ord.deliveryMode === 'express' ? 49.00 : 0;
      const netEarnings = Math.max(0, (subtotal + surgeFee + 30.00) * 0.85);

      return `
        <div class="modal-overlay" onclick="closeVendorSummaryModal()">
          <div class="modal-content" style="max-width: 600px;" onclick="event.stopPropagation()">
            <div class="modal-header" style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white;">
              <div>
                <h3 style="color: white;">📋 Order #${ord.id} Full Summary</h3>
                <p style="font-size: 0.8rem; color: #c7d2fe;">Customer: ${ord.customerName} (${ord.customerPhone})</p>
              </div>
              <button class="close-btn" style="color: white; background: rgba(255,255,255,0.2);" onclick="closeVendorSummaryModal()">✕</button>
            </div>
            <div style="padding: 24px; max-height: 80vh; overflow-y: auto;">
              <div style="background: var(--bg-main); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-light); margin-bottom: 16px;">
                <div style="font-weight: 700;">📍 Pickup Address:</div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">${ord.pickupAddress}</div>
                <div style="font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 4px;">📅 Scheduled Slot: ${ord.deliverySlot || 'Standard'}</div>
              </div>

              ${ord.carePreferences?.length > 0 ? `
                <div style="margin-bottom: 16px;">
                  <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">✨ CARE PREFERENCES:</div>
                  <div style="display: flex; gap: 6px; margin-top: 4px;">
                    ${ord.carePreferences.map(p => `<span style="background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;">✨ ${p}</span>`).join('')}
                  </div>
                </div>
              ` : ''}

              ${isRejected ? `
                <div style="background: var(--danger-light); color: var(--danger); padding: 12px; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 16px;">
                  <strong>❌ Order Rejected:</strong> ${ord.rejectionReason || 'Declined by provider'}
                </div>
              ` : ''}

              <h4 style="font-size: 0.95rem; margin-bottom: 8px;">👕 Garment Items Breakdown</h4>
              <div style="border: 1px solid var(--border-light); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 16px;">
                <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                  <thead>
                    <tr style="background: var(--bg-main); border-bottom: 1px solid var(--border-medium); text-align: left;">
                      <th style="padding: 8px 12px;">Garment Item</th>
                      <th style="padding: 8px 12px; text-align: center;">Qty</th>
                      <th style="padding: 8px 12px; text-align: right;">Rate</th>
                      <th style="padding: 8px 12px; text-align: right;">Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(ord.items || []).map(i => `
                      <tr style="border-bottom: 1px solid var(--border-light);">
                        <td style="padding: 8px 12px; font-weight: 600;">${i.name}</td>
                        <td style="padding: 8px 12px; text-align: center;">${i.qty} ${i.unit}</td>
                        <td style="padding: 8px 12px; text-align: right;">₹${(i.price || 0).toFixed(2)}</td>
                        <td style="padding: 8px 12px; text-align: right; font-weight: 700;">₹${((i.price || 0) * (i.qty || 1)).toFixed(2)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <div style="background: var(--bg-main); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-medium); margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; color: var(--primary);">
                  <span>Total Customer Bill:</span>
                  <span>₹${(ord.totalAmount || 0).toFixed(2)}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--secondary); font-weight: 700; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-medium);">
                  <span>Est. Provider Net Payout:</span>
                  <span>₹${netEarnings.toFixed(2)}</span>
                </div>
              </div>

              <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="filter-chip" onclick="window.print()">🖨️ Print Receipt</button>
                ${isPending ? `
                  <button class="filter-chip" style="color: var(--danger); background: var(--danger-light); font-weight: 700;" onclick="closeVendorSummaryModal(); openVendorRejectModal('${ord.id}')">❌ Reject Request</button>
                  <button class="view-btn" style="background: var(--secondary); font-weight: 700;" onclick="closeVendorSummaryModal(); acceptVendorOrder('${ord.id}')">✅ Accept & Start Job</button>
                ` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openCustomerOrdersModal() { state.isCustomerOrdersOpen = true; render(); }
    function closeCustomerOrdersModal() { state.isCustomerOrdersOpen = false; render(); }

    function renderCustomerOrdersModal() {
      if (!state.isCustomerOrdersOpen) return '';

      const customerOrders = state.orders.filter(o => {
        if (!state.user) return true;
        const matchEmail = state.user.email && o.customerEmail && o.customerEmail.toLowerCase() === state.user.email.toLowerCase();
        const matchPhone = state.user.phone && o.customerPhone && o.customerPhone.includes(state.user.phone);
        const matchName = state.user.name && o.customerName && o.customerName.toLowerCase().includes(state.user.name.toLowerCase());
        return matchEmail || matchPhone || matchName || !o.customerEmail;
      });

      return `
        <div class="modal-overlay" onclick="closeCustomerOrdersModal()">
          <div class="modal-content" style="max-width: 620px;" onclick="event.stopPropagation()">
            <div class="modal-header" style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white;">
              <div>
                <h3 style="color: white; margin: 0;">📦 My Service Requests (${customerOrders.length})</h3>
                <p style="font-size: 0.8rem; color: #c7d2fe; margin-top: 2px;">Account: ${state.user?.name || 'Customer'} (${state.user?.email || 'priya@example.in'})</p>
              </div>
              <button class="close-btn" style="color: white; background: rgba(255,255,255,0.2);" onclick="closeCustomerOrdersModal()">✕</button>
            </div>
            <div style="padding: 24px; max-height: 75vh; overflow-y: auto;">
              ${customerOrders.length === 0 ? `
                <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                  <h4>No Service Requests Placed Yet</h4>
                  <p style="font-size: 0.85rem; margin-top: 4px;">Book laundry pickup from the marketplace to track your request here!</p>
                </div>
              ` : customerOrders.map(ord => `
                <div style="background: white; border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); border-left: ${ord.status === 'Order Placed' ? '4px solid #f59e0b' : ord.status === 'Rejected' ? '4px solid #ef4444' : '4px solid var(--primary)'}">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <div>
                      <strong style="color: var(--primary);">#${ord.id}</strong>
                      <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 6px;">Shop: <strong>${ord.shopName}</strong></span>
                    </div>
                    <span class="badge ${ord.status === 'Order Placed' ? 'badge-warning' : ord.status === 'Rejected' ? 'badge-rejected' : 'badge-completed'}">${ord.status}</span>
                  </div>
                  <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">📍 ${ord.pickupAddress}</div>
                  <div style="background: var(--bg-main); padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.8rem; margin-bottom: 8px;">
                    ${(ord.items || []).map(i => `<div>• ${i.name} (x${i.qty} ${i.unit})</div>`).join('')}
                  </div>
                  ${ord.status === 'Rejected' ? `
                    <div style="font-size: 0.78rem; color: var(--danger); background: var(--danger-light); padding: 6px 10px; border-radius: var(--radius-md); margin-bottom: 8px;">
                      ❌ Rejection Note from Provider: ${ord.rejectionReason || 'Shop Capacity Full'}
                    </div>
                  ` : ''}
                  ${ord.status === 'Order Placed' ? `
                    <div style="font-size: 0.78rem; color: #b45309; background: #fffbeb; padding: 6px 10px; border-radius: var(--radius-md); margin-bottom: 8px;">
                      📥 Request Sent to Provider: Waiting for shop owner acceptance...
                    </div>
                  ` : ''}
                  <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 8px;">
                    <span style="font-weight: 800; color: var(--primary);">₹${(ord.totalAmount || 0).toFixed(2)}</span>
                    <button class="view-btn" style="padding: 4px 12px; font-size: 0.78rem;" onclick="closeCustomerOrdersModal(); openTracker('${ord.id}')">
                      Track Live ➔
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
